<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HayaiKaado - Japanese Flashcard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html,
        body {
            height: 100%;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: url('images/kana_pattern.png') repeat center top / auto;
            opacity: 0.2;
            z-index: -1;
        }
    </style>
</head>

<body class="flex flex-col">
    <!-- Header -->
    <div class="w-full p-4">
        <h1 class="text-center text-2xl font-bold text-red-500 md:text-4xl md:font-extrabold tracking-tight">
            HayaiKaado
        </h1>

        <p class="text-center text-gray-500 text-md font-semibold mt-1">
            Japanese Flashcard for Japanese Learners
        </p>
    </div>

    <!-- Flashcard -->
    <div id="app" class="flex-1 flex items-center justify-center px-4">
        <div class="w-full max-w-xl">
            <div
                class="bg-white shadow-xl rounded-2xl p-10 text-center transition hover:shadow-2xl border border-gray-200">
                <div class="text-7xl md:text-8xl font-bold text-gray-800 mb-6">
                    先生
                </div>
                <div class="text-xl text-gray-600 mb-2">せんせい</div>
                <div class="text-sm text-gray-500">Sensei</div>
            </div>
        </div>
    </div>
</body>

</html>
